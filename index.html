
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#050610">
<meta name="description" content="Ariya.code | Design & Development">
<title>Ariya.code | Official</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #050610;
  --blue: #63d9ff;
  --purple: #a88aff;
  --white: #f4f5ff;
  --muted: #9296b2;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  isolation: isolate;
}

#universe {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -3;
}

.aurora {
  position: fixed;
  inset: -30%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 25%, #1749a64a, transparent 36%),
    radial-gradient(ellipse at 80% 70%, #7026bd38, transparent 36%),
    radial-gradient(ellipse at 55% 10%, #087e9b20, transparent 35%);
  filter: blur(35px);
  animation: aurora 14s ease-in-out infinite alternate;
}

@keyframes aurora {
  0% { transform: translate(-3%, -2%) rotate(0deg) scale(1); }
  100% { transform: translate(3%, 2%) rotate(8deg) scale(1.15); }
}

.grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(#ffffff07 1px, transparent 1px),
    linear-gradient(90deg, #ffffff07 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse, black, transparent 78%);
}

.page {
  width: min(100% - 32px, 460px);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px 0;
  animation: entrance 1.1s ease both;
}

@keyframes entrance {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  direction: ltr;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 5px;
  color: #b5c6ed;
  margin-bottom: clamp(12px, 2.5vh, 24px);
}

.logo-frame {
  width: clamp(112px, 22vh, 164px);
  height: clamp(112px, 22vh, 164px);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: clamp(12px, 2.5vh, 21px);
}

.logo-frame::before,
.logo-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid transparent;
  border-top-color: var(--blue);
  border-left-color: #8c7cff;
  filter: drop-shadow(0 0 8px #55d8ff);
  animation: spin 8s linear infinite;
}

.logo-frame::after {
  inset: 9px;
  border-top-color: #c5a6ff;
  border-left-color: transparent;
  border-bottom-color: #54cfff;
  animation-direction: reverse;
  animation-duration: 12s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.logo-glow {
  position: absolute;
  width: 78%;
  height: 78%;
  border-radius: 50%;
  background: #6572ff20;
  filter: blur(24px);
  animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
  50% { opacity: .4; transform: scale(.8); }
}

.logo {
  position: relative;
  z-index: 2;
  width: 72%;
  height: 72%;
  object-fit: contain;
  filter: drop-shadow(0 0 16px #7e91ff66);
}

.brand {
  direction: ltr;
  font-size: clamp(29px, 7vw, 39px);
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: 1px;
  background: linear-gradient(100deg, #ffffff 15%, #82dcff 52%, #b99aff 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 7px;
}

.tagline {
  direction: ltr;
  color: #969bb8;
  font-size: 9px;
  letter-spacing: 3px;
  margin-bottom: clamp(17px, 3.5vh, 29px);
}

.separator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
  color: #d6c8ff;
  font-size: 13px;
  font-weight: 500;
}

.separator::before,
.separator::after {
  content: "";
  width: 42px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #8e91ff);
}

.separator::after {
  transform: rotate(180deg);
}

.contact-panel {
  width: 100%;
  padding: clamp(12px, 2.5vh, 19px);
  border: 1px solid #ffffff18;
  border-radius: 24px;
  background: linear-gradient(145deg, #ffffff0d, #ffffff04);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow:
    0 20px 70px #00000060,
    inset 0 1px 0 #ffffff15,
    0 0 35px #526eff0c;
}

.contact-link {
  width: 100%;
  min-height: 57px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 9px 12px;
  margin-bottom: 10px;
  border-radius: 15px;
  text-decoration: none;
  color: white;
  text-align: right;
  background: linear-gradient(100deg, #ffffff0b, #ffffff04);
  border: 1px solid #ffffff12;
  transition: transform .25s ease, border-color .25s ease, background .25s ease;
  position: relative;
  overflow: hidden;
}

.contact-link:last-child {
  margin-bottom: 0;
}

.contact-link::before {
  content: "";
  position: absolute;
  top: 0;
  left: -110%;
  width: 65%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #ffffff12, transparent);
  transform: skewX(-20deg);
  transition: left .65s ease;
}

.contact-link:hover::before,
.contact-link:active::before {
  left: 140%;
}

.contact-link:hover {
  transform: translateY(-2px);
  border-color: #83cfff66;
  background: #8a83ff13;
}

.icon-box {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 20px;
  color: #b8dfff;
  border: 1px solid #8c9dff38;
  background: linear-gradient(145deg, #4daaff22, #a47bff25);
}

.info {
  flex: 1;
  min-width: 0;
}

.info strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #f4f4ff;
  margin-bottom: 2px;
}

.info small {
  display: block;
  direction: ltr;
  text-align: right;
  font-size: 10px;
  color: #a5aac6;
}

.arrow {
  color: #9b9eff;
  font-size: 17px;
  padding-left: 3px;
}

@media (max-height: 650px) {
  .eyebrow { margin-bottom: 8px; }
  .logo-frame {
    width: 94px;
    height: 94px;
    margin-bottom: 8px;
  }
  .brand { font-size: 27px; }
  .tagline { margin-bottom: 12px; }
  .contact-panel { padding: 10px; }
  .contact-link { min-height: 48px; margin-bottom: 7px; }
  .separator { margin-bottom: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<canvas id="universe"></canvas>
<div class="aurora"></div>
<div class="grid"></div>

<main class="page">

  <div class="eyebrow">WELCOME TO MY DIGITAL WORLD</div>

  <div class="logo-frame">
    <div class="logo-glow"></div>
    <img class="logo" src="1000115799.png" alt="Ariya.code">
  </div>

  <h1 class="brand">Ariya.code</h1>

  <div class="tagline">DESIGN • DEVELOPMENT • INNOVATION</div>

  <div class="separator">راه‌های ارتباطی</div>

  <section class="contact-panel">

    <a class="contact-link" href="tel:+989370770905">
      <div class="icon-box">☎</div>
      <div class="info">
        <strong>تماس تلفنی</strong>
        <small>+98 937 077 0905</small>
      </div>
      <div class="arrow">←</div>
    </a>

    <a class="contact-link"
       href="https://www.instagram.com/ariya.cod/"
       target="_blank" rel="noopener noreferrer">
      <div class="icon-box">◎</div>
      <div class="info">
        <strong>اینستاگرام</strong>
        <small>@ariya.cod</small>
      </div>
      <div class="arrow">←</div>
    </a>

    <a class="contact-link"
       href="https://wa.me/message/X6SDMN52FFCDF1"
       target="_blank" rel="noopener noreferrer">
      <div class="icon-box">◉</div>
      <div class="info">
        <strong>واتساپ</strong>
        <small>ارتباط مستقیم با ما</small>
      </div>
      <div class="arrow">←</div>
    </a>

  </section>

</main>

<script>
const canvas = document.getElementById('universe');
const ctx = canvas.getContext('2d');

let w, h, stars = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  stars = Array.from({length: Math.min(85, Math.floor(w * h / 8500))}, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.5 + .3,
    speed: Math.random() * .35 + .08,
    phase: Math.random() * Math.PI * 2
  }));
}

function animate(time) {
  ctx.clearRect(0, 0, w, h);

  stars.forEach(s => {
    s.y -= s.speed;
    if (s.y < -5) {
      s.y = h + 5;
      s.x = Math.random() * w;
    }

    const alpha = .25 + (Math.sin(time * .001 + s.phase) + 1) * .3;

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150,205,255,${alpha})`;
    ctx.shadowBlur = 9;
    ctx.shadowColor = '#62caff';
    ctx.fill();
  });

  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
