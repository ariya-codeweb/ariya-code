@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--cyan:#26d9ff;--blue:#2878ff;--violet:#8b39ff;--pink:#e34dff;--ink:#050510;--white:#f7f7ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--white);display:grid;place-items:center;padding:clamp(10px,2.8vw,24px);background:radial-gradient(ellipse at 50% 48%,#17103a 0,#0b0b20 37%,#050510 78%);isolation:isolate;position:relative}
#codefield{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.92}
.aurora{position:fixed;inset:-35%;z-index:-2;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,transparent 0 18%,rgba(32,115,255,.15) 25%,transparent 34%,rgba(166,42,255,.18) 47%,transparent 59%,rgba(0,220,255,.13) 72%,transparent 84%);filter:blur(45px);animation:aurora 24s linear infinite}
.gridglow{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(91,113,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(91,113,255,.075) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,#000 8%,transparent 78%);opacity:.55}
@keyframes aurora{to{transform:rotate(360deg)}}
main{width:min(100%,450px);max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;isolation:isolate;padding:clamp(16px,3.5vh,30px) clamp(15px,4vw,27px);border-radius:30px;border:1px solid rgba(145,151,255,.28);background:linear-gradient(145deg,rgba(19,20,49,.83),rgba(8,8,24,.88) 58%,rgba(19,10,43,.86));backdrop-filter:blur(18px);box-shadow:0 22px 85px #0009,0 0 50px #573aff27,inset 0 1px #ffffff16;overflow:hidden}
main:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(130deg,#31d9ff88,#8246ff88,transparent 43%,#e34dff66,#26d9ff88);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.logo-wrap{width:clamp(130px,27vh,190px);height:clamp(130px,27vh,190px);flex:0 0 auto;position:relative;display:grid;place-items:center;margin-bottom:clamp(10px,2.4vh,19px)}
.logo-wrap:before,.logo-wrap:after{content:"";position:absolute;border-radius:50%;inset:-9px;border:2px solid transparent;border-top-color:#b04dff;border-right-color:#26d9ff;filter:drop-shadow(0 0 7px #6b4dff);animation:orbit 7s linear infinite}
.logo-wrap:after{inset:-17px;border-width:1px;border-top-color:#25d7ff;border-bottom-color:#8b39ff;border-right-color:transparent;animation:orbitBack 11s linear infinite}
.orbit-dot{position:absolute;width:8px;height:8px;top:4px;left:18%;border-radius:50%;background:#5deaff;box-shadow:0 0 13px 4px #2dbdff;animation:orbit 7s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
.logo{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%;position:relative;z-index:1;filter:drop-shadow(0 0 18px #3c70ff66)}
h1{font:800 clamp(30px,7vw,39px)/1 Arial,sans-serif;direction:ltr;margin:0;letter-spacing:-1px;text-shadow:0 0 25px #755aff30}
.name{color:#fff}
.code{background:linear-gradient(95deg,#21d9ff,#397bff 46%,#b64bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font:500 clamp(10px,2.7vw,13px)/1.5 Arial,sans-serif;direction:ltr;letter-spacing:1.1px;color:#c8d4ff;margin:9px 0 clamp(14px,3vh,22px)}
.separator{height:2px;width:74px;border-radius:9px;background:linear-gradient(90deg,#24dfff,#536bff,#b64aff);box-shadow:0 0 18px #7352ff8c;margin-bottom:clamp(14px,3vh,22px)}
.links{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
a.link{min-width:0;min-height:clamp(74px,12vh,88px);padding:10px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;text-decoration:none;color:#f5f6ff;border:1px solid #889cff35;border-radius:17px;background:linear-gradient(145deg,#243d714d,#30205255 65%,#142d4a55);box-shadow:inset 0 1px #ffffff12;transition:transform .22s,border-color .22s,box-shadow .22s}
a.link:hover{transform:translateY(-4px);border-color:#4bdfffaa;box-shadow:0 8px 26px #386aff30,0 0 18px #9a45ff20}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#d9f8ff;background:linear-gradient(135deg,#19bfff38,#9b43ff55);border:1px solid #a4baff35;box-shadow:0 0 16px #5c7dff20}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.link strong{font-size:clamp(10px,2.8vw,12px);font-weight:600;white-space:nowrap}
.phone{font:12px Arial,sans-serif;direction:ltr;color:#c9d5ff;margin-top:clamp(12px,2.7vh,19px);letter-spacing:.5px}
footer{font:9px Arial,sans-serif;direction:ltr;letter-spacing:2.4px;color:#7783b4;margin-top:10px}
@media(max-height:620px){
main{padding:10px 17px;border-radius:23px}

@media(max-width:350px){

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}

<script>
(()=>{
const c=document.getElementById('codefield'),ctx=c.getContext('2d');
let w,h,dpr,items=[];
const symbols=['</>','{ }','const','=>','0101','<div>','PHP','CSS','JS',';','&&','[ ]'];
function resize(){
dpr=Math.min(devicePixelRatio||1,2);
w=innerWidth;h=innerHeight;
c.width=w*dpr;c.height=h*dpr;
c.style.width=w+'px';c.style.height=h+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);
let count=Math.max(18,Math.min(42,Math.floor(w*h/26000)));
items=Array.from({length:count},(_,i)=>({
x:Math.random()*w,y:Math.random()*h,
s:10+Math.random()*10,v:.12+Math.random()*.35,
a:.12+Math.random()*.27,t:symbols[i%symbols.length],
hue:Math.random()<.5?190+Math.random()*35:255+Math.random()*65
}));
}
function draw(){
ctx.clearRect(0,0,w,h);
for(const p of items){
p.y-=p.v;
if(p.y<-30){p.y=h+25;p.x=Math.random()*w}
ctx.font=`500 ${p.s}px monospace`;
ctx.fillStyle=`hsla(${p.hue},100%,72%,${p.a})`;
ctx.shadowBlur=12;
ctx.shadowColor=`hsla(${p.hue},100%,60%,.45)`;
ctx.fillText(p.t,p.x,p.y);
}
ctx.shadowBlur=0;
requestAnimationFrame(draw);
}
addEventListener('resize',resize);
resize();draw();
})();
</script>
