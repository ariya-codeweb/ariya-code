<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070711">
  <meta name="description" content="Ariya.code | ارتباط با ما">
  <title>Ariya.code | Digital Experience</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #55cfff;
      --purple: #a77bff;
      --gold: #e8c98b;
      --white: #f5f2ff;
    }

    body {
      min-height: 100vh;
      background: #070711;
      color: var(--white);
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 35px 18px;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .22;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: #4b35ff;
      top: -170px;
      right: -130px;
    }

    body::after {
      background: #008dca;
      bottom: -190px;
      left: -120px;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white 100%, transparent),
        radial-gradient(1px 1px at 80% 15%, white 100%, transparent),
        radial-gradient(1px 1px at 40% 75%, white 100%, transparent),
        radial-gradient(2px 2px at 90% 80%, white 100%, transparent),
        radial-gradient(1px 1px at 25% 55%, white 100%, transparent);
      background-size: 190px 190px;
      z-index: 0;
    }

    .page {
      width: 100%;
      max-width: 490px;
      position: relative;
      z-index: 1;
      text-align: center;
      animation: appear 1s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-label {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 5px;
      direction: ltr;
      margin-bottom: 23px;
      opacity: .9;
    }

    .logo-area {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-area::before,
    .logo-area::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--blue);
      border-bottom-color: var(--purple);
      animation: rotate 9s linear infinite;
    }

    .logo-area::after {
      inset: 9px;
      border-top-color: var(--gold);
      border-bottom-color: transparent;
      animation-direction: reverse;
      animation-duration: 13s;
      opacity: .7;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .logo {
      width: 125px;
      max-height: 125px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 18px #6b6aff55);
    }

    h1 {
      font-size: 29px;
      letter-spacing: 1px;
      direction: ltr;
      margin-bottom: 9px;
      background: linear-gradient(90deg, #ffffff, #9edfff, #c5a4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: #aaa8c4;
      letter-spacing: 2px;
      direction: ltr;
      margin-bottom: 35px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--gold);
      font-size: 15px;
      margin-bottom: 17px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      height: 1px;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .section-title::after {
      transform: rotate(180deg);
    }

    .contact-box {
      padding: 24px 20px;
      border-radius: 25px;
      border: 1px solid #ffffff20;
      background: linear-gradient(
        145deg,
        #ffffff0d,
        #ffffff04
      );
      box-shadow:
        0 20px 70px #00000070,
        inset 0 1px 0 #ffffff12,
        0 0 35px #765bff12;
      backdrop-filter: blur(18px);
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      border: 1px solid #ffffff12;
      background: #ffffff07;
      transition: .3s ease;
      text-align: right;
    }

    .contact-link:last-child {
      margin-bottom: 0;
    }

    .contact-link:hover {
      transform: translateY(-3px);
      border-color: #9b8cff77;
      background: #ffffff12;
      box-shadow: 0 8px 25px #7964ff20;
    }

    .contact-icon {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(135deg, #4a9dff30, #9b6aff30);
      border: 1px solid #a9a0ff30;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-info strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #fff;
    }

    .contact-info span {
      display: block;
      font-size: 11px;
      color: #aaa9c2;
      direction: ltr;
      text-align: right;
    }

    .arrow {
      color: var(--gold);
      font-size: 18px;
      opacity: .8;
    }

    .footer {
      margin-top: 27px;
      color: #77758e;
      font-size: 10px;
      letter-spacing: 1px;
      direction: ltr;
    }

    .footer span {
      color: var(--gold);
    }

    @media (max-width: 380px) {
      .logo-area {
        width: 150px;
        height: 150px;
      }

      .logo {
        width: 105px;
      }

      h1 {
        font-size: 25px;
      }

      .contact-box {
        padding: 18px 14px;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="page">

    <div class="top-label">WELCOME TO MY DIGITAL WORLD</div>

    <div class="logo-area">
      <img
        class="logo"
        src="1000115799.png"
        alt="Ariya.code Logo"
      >
    </div>

    <h1>Ariya.code</h1>
    <div class="subtitle">DESIGN • DEVELOPMENT • DIGITAL</div>

    <div class="section-title">راه‌های ارتباطی</div>

    <section class="contact-box">

      <a class="contact-link" href="tel:+989370770905">
        <div class="contact-icon">☎</div>
        <div class="contact-info">
          <strong>تماس تلفنی</strong>
          <span>+98 937 077 0905</span>
        </div>
        <div class="arrow">←</div>
      </a>

      <a class="contact-link"
         href="https://www.instagram.com/ariya.cod/"
         target="_blank" rel="noopener noreferrer">
        <div class="contact-icon">◎</div>
        <div class="contact-info">
          <strong>اینستاگرام</strong>
          <span>@ariya.cod</span>
        </div>
        <div class="arrow">←</div>
      </a>

      <a class="contact-link"
         href="https://wa.me/message/X6SDMN52FFCDF1"
         target="_blank" rel="noopener noreferrer">
        <div class="contact-icon">◉</div>
        <div class="contact-info">
          <strong>واتساپ</strong>
          <span>ارتباط مستقیم با ما</span>
        </div>
        <div class="arrow">←</div>
      </a>

    </section>

    <footer class="footer">
      CRAFTED WITH <span>✦</span> BY ARIYA.CODE
    </footer>

  </main>
</body>
</html>
